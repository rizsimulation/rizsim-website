rmed arrangement for another colleague’s response."]}, {"id": "K2", "stem": "Farah notices an unanswered forum post and immediately thinks, “Another tutor is probably handling it.” She then checks the response log before deciding what to do. Which description best fits this sequence?", "options": ["System 2 produced the assumption; System 1 checked the evidence.", "System 1 produced both steps because each concerned familiar teaching.", "System 2 produced both steps because each involved professional responsibility.", "System 1 produced the assumption; System 2 checked the evidence."]}, {"id": "K3", "stem": "In a joint teaching team, an unresolved course-access problem is visible to everyone, but no one has accepted it. Which next step most directly reduces the risk of continued inaction?", "options": ["Name one responder, confirm acceptance, and set a follow-up time.", "Notify additional colleagues, widen circulation, and await a voluntary response.", "Repeat the original message, highlight urgency, and await team agreement.", "Hold the request, compile context, and revisit the next meeting."]}, {"id": "K4", "stem": "A lecturer believes AI feedback weakens student reasoning. While reviewing a pilot, he retains critical comments and sets aside equally relevant positive comments. Which pattern best describes his review?", "options": ["Evidence is weighted mainly by the timing of its arrival.", "Evidence is weighted mainly by how it supports existing expectations.", "Evidence is weighted mainly by how clearly reports describe methods.", "Evidence is weighted mainly by the number of students represented."]}, {"id": "K5", "stem": "A course leader spends an hour building a detailed argument for her preferred AI marking tool. She does not examine evidence against it. What is the most defensible interpretation?", "options": ["Extended reasoning establishes that the preferred tool meets educational needs.", "Deliberate reasoning is absent whenever a person retains initial p esence of other potential helpers can reduce an individual’s likelihood of helping. One mechanism is diffusion of responsibility: “someone else will act” substitutes for checking whether anyone has accepted the task. Darley and Latané’s 1968 experiment showed reduced and delayed individual intervention when participants believed other witnesses were present.", "In this educational illustration, the immediately available assumption resembles System 1 thinking. Deliberately checking the record, clarifying responsibility, and confirming follow-through illustrate a constructive use of System 2. A shared notification is evidence that people received information; it is not evidence that someone is responding.", "Quick responses can also be skilled and helpful, while deliberate reasoning can justify avoidance. The goal is not to make every decision slower: it is to replace an unsupported ownership assumption with a check. The classroom case applies a research principle; it does not establish that every group will fail to act."], "steps": ["Notice the request", "Check actual ownership", "Confirm acceptance", "Follow through"], "reference": "Research basis: Darley & Latané (1968); Evans & Stanovich (2013). Educational application developed for this workshop."}}, "transfer": {"title": "The correction before release", "context": "University course team · Teaching-material review", "kind": "release", "text": "Six university educators review AI-assisted revision slides. They all notice an incorrect explanation. The chair moves to the next agenda item, and each editor assumes another reviewer will correct it. The slides are scheduled for release at 17:00; the shared tracker still shows no accepted correction task.", "board": {"stats": [["6", "Reviewers"], ["0", "Accepted corrections"], ["17:00", "Release time"]], "message": "The explanation remains unchanged in the release version."}, "stem": "Which next step most directly reduces the risk that the error will reach students?", "options": ["Suggest another meeting so the reviewers can discuss possible revisions.", "Ask the group generally whether anyone can resolve the issue.", "Leave the correction pending while awaiting the most experienced reviewer.", "Confirm one editor, agree a deadline, and verify the correction."], "feedback": {"title": "Transfer the mechanism, not the wording", "paragraphs": ["The surface problem has changed from learner access to the accuracy of teaching material. The underlying vulnerability is still shared awareness without accepted responsibility. A named task owner, an agreed completion point, and a check on the revised material turn collective concern into traceable action.", "This is a practical use of deliberate checking, not a claim that System 2 always helps. Institutional workload, authority, and available support also matter. The educational lesson is to verify the action pathway rather than infer it from the number of people who noticed an issue."], "steps": ["Different setting", "Same ownership gap", "Observable follow-through"], "reference": "Research basis: Darley & Latané (1968); Evans & Stanovich (2013). Educational application, not an emergency experiment."}}}, {"id": "L2", "concept": "Confirmation bias", "source": {"title": "The pilot summary", "context": "Cross-institution teaching pilot · AI-generated feedback", "kind": "pilot", "text": "Bilal expects AI-generated feedback to improve learning. Before a pilot, the team agreed to examine feedback clarity and a common learning task. The task results are available but not yet reviewed. Bilal selects the favorable learner comments and asks an AI assistant: “Write a convincing argument that this pilot proves the tool improves learning.”", "board": {"stats": [["4", "Helpful next steps"], ["4", "Too general"], ["4", "No noticeable change"]], "message": "12 learner comments · Common learning-task results awaiting review"}, "stem": "Which next step best tests Bilal’s interpretation?", "options": ["Compare const STORE='RizSimulation_AI_Pedagogy_Participant_v1'+(new URLSearchParams(location.search).get('attempt')?':'+new URLSearchParams(location.search).get('attempt'):'');
let record=null,navIndex={kr:0,kg:0},personalRGA=null,persistOK=true;
try{const saved=window.__RIZSIM_SIM02_HOSTED__?null:JSON.parse(localStorage.getItem(STORE)||'null');if(saved){record=validateRecord(saved.record);navIndex=saved.navIndex||navIndex;personalRGA=saved.personalRGA||null}}catch(e){record=null;persistOK=false}
function persist(){if(record){record.revision++;record.updatedAt=now()}try{localStorage.setItem(STORE,JSON.stringify({record,navIndex,personalRGA}));persistOK=true}catch(e){persistOK=false}}
function participantAside(){return`<aside class="aside"><div class="panel"><span class="eyebrow">Your progress</span><div class="mini-donut" style="--pct:${lockedCount(record)/16*100}%"><span>${lockedCount(record)}/16</span></div><p class="small" style="text-align:center">Decisions committed<br>6 KR + 4 LT + 6 KG</p><hr class="divider"><div class="detail-list"><div><span>Participant</span><strong>${esc(record.profile.name)}</strong></div><div><span>Organization</span><strong>${esc(record.profile.organization)}</strong></div></div><div class="actions start"><button class="btn secondary full compact" onclick="exportProgress()">Export response file</button></div><p class="chart-note">Exported files include committed responses only. Give your final file to the presenter.</p></div><div class="panel dark"><h3>Independent first. Discuss later.</h3><p class="small">Work from the information provided. Feedback follows committed case decisions. Earlier choices remain locked.</p><hr class="rule"><p class="small" style="margin-bottom:0">Progress stays in this browser when local storage is available. No responses are sent automatically.</p></div></aside>`}
function joinView(){return`<div class="join-screen">${hero('Participant',false,true)}<div class="workspace join-workspace"><section class="panel join-panel"><div class="panel-title"><div><div class="eyebrow">Begin your practice</div><h2>Introduce yourself</h2></div></div><form id="joinForm"><div class="grid2"><div class="field"><label for="pname">Participant Name <span aria-hidden="true">*</span></label><input id="pname" name="name" type="text" maxlength="120" autocomplete="name" required placeholder="Your full name"></div><div class="field"><label for="porg">Organization <span aria-hidden="true">*</span></label><input id="porg" name="organization" type="text" maxlength="180" autocomplete="organization" required placeholder="College, university, or organization"></div></div><div class="actions"><span class="small muted">* Required fields</span><button type="submit" class="btn dark">Begin Knowledge Review →</button></div></form><div class="join-guidance"><div class="join-guidance-meta"><span class="pill gold">Suggested 30 minutes</span></div><p class="muted">Enter your name and organization to begin offline practice. No code or internet connection is required.</p><div class="notice"><strong>Before starting</strong><br>Complete KR independently before consulting teaching material or an AI tool. You can review choices within KR, but submitting locks the whole stage. No answer key is included in this dashboard.</div><p class="small muted">Your name, organization, and committed answers will be included in the file you choose to share with the presenter. This is a low-stakes learning activity, not an evaluation of professional competence.</p></div></section><aside class="join-aside">${learningJourney()}<div class="panel dark"><div class="eyebrow" style="color:#8bd9d0">Workshop structure</div><h3>Six questions.<br>Two learning-transfer pairs.<br>A fresh review.</h3><p class="small">Commit each source judgment, read its explanation, and apply the idea in a genuinely new case. Complete Knowledge Gain independently with fresh responses.</p></div><div class="panel"><h3>Resume a saved response</h3><p class="small muted">Import your own exported checkpoint. Only locked responses are restored.</p><label class="btn secondary full compact" for="resumeInput">Import response file</label><input class="sr-only" id="resumeInput" type="file" accept=".json,application/json" onchange="resumeFile(event)"></div></aside></div></div>`}
function optionsView(item,selected,handler){return`<fieldset><legend class="sr-only">Choose one answer</legend><div class="options">${item.options.map((o,k)=>`<label class="option ${selected===k?'selected':''}"><input type="radio" name="decision" value="${k}" ${selected===k?'checked':''} onchange="${handler}(${k})"><span class="option-body"><span class="letter">${LETTERS[k]}</span>${esc(o)}</span></label>`).join('')}</div></fieldset>`}
function reviewView(stage){let index=Math.min(5,Math.max(0,Number(navIndex[stage])||0));navIndex[stage]=index;const order=recordOrder(record)[stage],itemIndex=order[index],q=DATA.review[itemIndex],answers=record[stage].a;const count=answers.filter(isAnswer).length;return`<div class="workspace"><section class="panel"><div class="panel-title"><div><div class="eyebrow">${stage==='kr'?'Knowledge Review':'Knowledge Gain'}</div><h2 id="viewTitle" tabindex="-1">${stage==='kr'?'Your starting understanding':'Your fresh review'}</h2></div><span class="pill outline">${index+1} of 6</span></div><p class="small muted">${stage==='kr'?'Choose one response for each question. No instructional feedback is available during KR.':'Choose one response for each question. Earlier answers are not shown or preselected.'}</p><div class="q-nav" aria-label="Question navigation">${order.map((item,k)=>`<button class="${isAnswer(answers[item])?'answered':''} ${index===k?'current':''}" ${index===k?'aria-current="true"':''} aria-label="Question ${k+1}, ${isAnswer(answers[item])?'answered':'unanswered'}" onclick="moveQuestion('${stage}',${k})">${k+1}</button>`).join('')}</div><div class="progress-track"><div class="progress-fill" style="width:${count/6*100}%"></div></div><p class="q-stem" data-item-id="${esc(q.id)}">${esc(q.stem)}</p>${optionsView(q,answers[itemIndex],'selectReview')}<div class="actions"><button class="btn secondary" onclick="moveQuestion('${stage}',${index-1})" ${index===0?'disabled':''}>← Previous</button>${index<5?`<button class="btn" onclick="moveQuestion('${stage}',${index+1})" ${!isAnswer(answers[itemIndex])?'disabled':''}>Next question →</button>`:`<button class="btn dark" onclick="lockReview('${stage}')" ${count!==6?'disabled':''}>Lock ${stage.toUpperCase()} · 6 responses</button>`}<span class="small muted">${count}/6 selected · Changes allowed until you lock this stage.</span></div></section>${participantAside()}</div>`}
function boardView(c){const b=c.board;return`<div class="case-board"><div class="board-label"><span>${c.kind==='inbox'?'Shared inbox snapshot':c.kind==='release'?'Release tracker':c.kind==='pilot'?'Pilot evidence board':'Review evidence board'}</span><span>${esc(b.time||'Case information')}</span></div>${b.message?`<div class="board-message">${esc(b.message)}${b.author?`<span class="author">${esc(b.author)}</span>`:''}</div>`:''}${c.kind==='pilot'?`<div class="board-columns" aria-hidden="true"><div class="board-column">4</div><div class="board-column">4</div><div class="board-column">4</div></div>`:''}<div class="board-stats">${b.stats.map(s=>`<div class="board-stat"><strong>${esc(s[0])}</strong><span>${esc(s[1])}</span></div>`).join('')}</div></div>`}
function ltStrip(i,kind,feedback){return`<div class="pair-strip"><span>Pair ${recordOrder(record).lt.indexOf(i)+1} of 2</span><span class="${kind==='source'&&!feedback?'on':''}">Source decision</span><span class="${kind==='source'&&feedback?'on':''}">Source feedback</span><span class="${kind==='transfer'&&!feedback?'on':''}">New transfer decision</span><span class="${kind==='transfer'&&feedback?'on':''}">Transfer feedback</span></div>`}
function caseView(i,kind){const c=DATA.pairs[i][kind],r=record.lt[i][kind];return`<div class="workspace"><section class="panel"><div class="eyebrow">Learning Transfer</div>${ltStrip(i,kind,false)}<div class="case-context">${esc(c.context)}</div><h2 id="viewTitle" tabindex="-1">${esc(c.title)}</h2><p style="line-height:1.8">${esc(c.text)}</p>${boardView(c)}<p class="q-stem">${esc(c.stem)}</p>${optionsView(c,r.a,'selectLT')}<div class="actions"><span class="small muted">One decision. Your response is locked before feedback.</span><button class="btn dark" onclick="lockLT(${i},'${kind}')" ${!isAnswer(r.a)?'disabled':''}>Commit ${kind} decision →</button></div></section>${participantAside()}</div>`}
function feedbackView(i,kind){const c=DATA.pairs[i][kind],f=c.feedback,r=record.lt[i][kind];return`<div class="workspace"><section class="panel feedback"><div class="eyebrow">Learning Transfer · ${esc(DATA.pairs[i].concept)}</div>${ltStrip(i,kind,true)}<div class="feedback-title"><span class="feedback-icon" aria-hidden="true">↗</span><h2 id="viewTitle" tabindex="-1" style="margin:0">${esc(f.title)}</h2></div><div class="locked-choice"><span class="small">Your committed decision</span><br><strong>${LETTERS[r.a]}.</strong> ${esc(c.options[r.a])}<br><span class="small">Response preserved. The explanation below teaches the mechanism; no answer key is displayed.</span></div>${f.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}<div class="process-row" style="--process-columns:${f.steps.length===3?3:4}">${f.steps.map((s,k)=>`<div class="process-node"><em>0${k+1}</em>${esc(s)}</div>`).join('')}</div><p class="reference">${esc(f.reference)}</p><div class="actions right"><button class="btn" onclick="markFeedback(${i},'${kind}')">${kind==='source'?'Apply in a new case':recordOrder(record).lt.indexOf(i)===0?'Continue to the second pair':'Begin Knowledge Gain'} →</button></div></section>${participantAside()}</div>`}
function resultsView(){let body;if(personalRGA){const m=personalRGA.metrics;body=`<div class="kpi-grid">${kpi('Knowledge Review',`${m.kr}<span class="small"> / 6</span>`,'Your locked starting score')}${kpi('Knowledge Gain',`${m.kg}<span class="small"> / 6</span>`,'Your repeated review score')}${kpi('Review change',signed(m.kg-m.kr,0),`${signed((m.kg-m.kr)/6*100,1)} percentage points`,true)}${kpi('Transfer',`${m.transfer}<span class="small"> / 2</span>`,`Source decisions: ${m.source}/2`)}</div><div class="grid2">${m.concepts.map(c=>`<section class="panel"><h3>${esc(c.name)}</h3>${bar('KR',c.kr,3,'gold',0)}${bar('KG',c.kg,3,'',0)}<p class="chart-note">Three review questions · Aggregate scores only</p></section>`).join('')}</div><div class="notice gold">This is immediate performance on a six-question repeated review, not a measure of long-term learning or professional ability. A change can reflect instruction, practice, or other influences. Transfer is reported separately and is based on only two cases.</div>`}else{body=`<div class="kpi-grid">${kpi('KR decisions','6 / 6','Locked baseline')}${kpi('LT decisions','4 / 4','Two complete case pairs')}${kpi('KG decisions','6 / 6','Fresh responses locked')}${kpi('Personal results','Pending','Waiting for RizSim verification',true)}</div><div class="panel"><div class="panel-title"><div><div class="eyebrow">Ready for Review Gain Analytics</div><h2>Share your responses.<br>Receive your personal summary.</h2></div><span class="completed-tick" aria-hidden="true">✓</span></div><p>RizSim computes your personal result securely after confirming your final submission. Scores appear when the server verifies your completed attempt.</p><div class="notice">Your completed responses have been stored in your authorized RizSim classroom attempt. Personal results are issued after the server verifies your submission.</div><div class="actions start"><button class="btn" onclick="exportProgress()">Download final response file</button></div></div>`}return`<section><div class="eyebrow">Review Gain Analytics</div><h2 id="viewTitle" tabindex="-1">${personalRGA?'Your learning review':'Your decisions are complete'}</h2><p class="muted">${esc(record.profile.name)} · ${esc(record.profile.organization)}</p>${body}<input class="sr-only" id="rgaInput" type="file" accept=".json,application/json" onchange="importRGA(event)"><div class="panel no-print"><h3>Keep your record</h3><div class="actions start"><button class="btn secondary" onclick="exportProgress()">Export responses again</button>${personalRGA?'<button class="btn secondary" onclick="window.print()">Print personal summary</button>':''}<a class="btn secondary" href="/access-in.html">Return to Student workspace</a></div><p class="chart-note">This classroom attempt is server-owned. Closing the page does not erase completed or saved responses.</p></div></section>`}
function render(scroll=false){const p=phase(record);$('app').classList.toggle('join-shell',p==='join');$('app').innerHTML=(p==='join'?joinView():stepper(record)+(!persistOK?'<div class="notice red">Browser storage is unavailable. Keep this tab open and export committed checkpoints after each stage.</div>':'')+(p==='kr'||p==='kg'?reviewView(p):p==='rga'?resultsView():(()=>{const a=p.split('_'),i=Number(a[a.length-1]);return p.includes('feedback')?feedbackView(i,a[0]):caseView(i,a[0])})()))+commonFoot();if(p==='join')$('joinForm').addEventListener('submit',start);if(scroll){window.scrollTo({top:Math.max(0,$('app').offsetTop-10),behavior:'auto'});setTimeout(()=>$('viewTitle')?.focus({preventScroll:true}),0)}}
function start(e){e.preventDefault();const name=$('pname').value.trim(),organization=$('porg').value.trim();if(!name||!organization){toast('Participant Name and Organization are required.');return}record=newRecord({name,organization,group:'Not specified',session:OFFLINE_SESSION});persist();render(true)}
function selectReview(v){const p=phase(record);if(!['kr','kg'].includes(p)||record[p].at)return;record[p].a[recordOrder(record)[p][navIndex[p]]]=v;persist();const scrollY=window.scrollY;render();window.scrollTo(0,scrollY);document.querySelector(`input[name=decision][value="${v}"]`)?.focus({preventScroll:true})}
function moveQuestion(stage,i){if(phase(record)!==stage||i<0||i>5)return;navIndex[stage]=i;persist();render(true)}

/* Secure hosted mode: score only after server-confirmed completion via authorized RPC.
   The protected Faculty answer key must never be embedded in the hosted HTML. */
/* Classroom lock confirmations use an in-page, keyboard-accessible dialog instead
   of window.confirm: browser automation and real Students must see the same action.
   IMPORTANT: the accepted callback calls the WRAPPED lock function again so the
   real hosted adapter saves, checks server access and enforces immutable stages. */
function confirmCommittedDecision(message,onAccept){
 if(document.getElementById('rzSim02CommitModal'))return;
 const previous=document.activeElement;
 const overlay=document.createElement('div');
 overlay.id='rzSim02CommitModal';overlay.className='rz-s02-confirm-overlay';
 const panel=document.createElement('section');panel.className='rz-s02-confirm-panel';
 panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true');
 panel.setAttribute('aria-labelledby','rzSim02CommitTitle');
 panel.setAttribute('aria-describedby','rzSim02CommitMessage');
 panel.innerHTML='<h2 id="rzSim02CommitTitle">Confirm your decision</h2>'+
   '<p id="rzSim02CommitMessage"></p>'+
   '<div class="rz-s02-confirm-actions">'+
   '<button type="button" class="btn secondary" id="rzSim02CommitCancel">Go back</button>'+
   '<button type="button" class="btn dark" id="rzSim02CommitAccept">Confirm &amp; lock</button></div>';
 panel.querySelector('#rzSim02CommitMessage').textContent=message;
 overlay.appendChild(panel);
 const cancel=panel.querySelector('#rzSim02CommitCancel');
 const accept=panel.querySelector('#rzSim02CommitAccept');
 let closed=false;
 function close(){
   if(closed)return false;closed=true;overlay.remove();
   if(previous?.isConnected&&typeof previous.focus==='function')previous.focus();
   return true;
 }
 cancel.addEventListener('click',()=>close());
 accept.addEventListener('click',()=>{if(close())onAccept()});
 overlay.addEventListener('keydown',ev=>{
   if(ev.key==='Escape'){ev.preventDefault();close();return;}
   if(ev.key==='Tab'){
     const order=[cancel,accept],i=order.indexOf(document.activeElement);
     if(i>=0){ev.preventDefault();order[(i+(ev.shiftKey?1:1))%2].focus();}
   }
 });
 document.body.appendChild(overlay);cancel.focus();
}

function lockReview(stage,confirmed=false){if(phase(record)!==stage||record[stage].a.some(a=>!isAnswer(a)))return;if(!confirmed){confirmCommittedDecision(`Lock all six ${stage.toUpperCase()} responses? You will not be able to revise them.`,()=>lockReview(stage,true));return;}record[stage].at=now();if(stage==='kg'){record.completedAt=record[stage].at;personalRGA=null}persist();render(true);toast(`${stage.toUpperCase()} responses locked.`)}
function selectLT(v){const p=phase(record);if(!/^(source|transfer)_[01]$/.test(p))return;const [kind,si]=p.split('_');record.lt[Number(si)][kind].a=v;persist();const y=window.scrollY;render();window.scrollTo(0,y);document.querySelector(`input[name=decision][value="${v}"]`)?.focus({preventScroll:true})}
function lockLT(i,kind,confirmed=false){if(phase(record)!==`${kind}_${i}`||!isAnswer(record.lt[i][kind].a))return;if(!confirmed){confirmCommittedDecision('Commit this decision and open the explanation? Your original response will stay locked.',()=>lockLT(i,kind,true));return;}record.lt[i][kind].at=now();persist();render(true)}
function markFeedback(i,kind){if(phase(record)!==`${kind}_feedback_${i}`)return;record.lt[i][kind].seen=now();persist();render(true)}
function exportProgress(){if(!record)return;dump(`RizResponse_${safeName(record.profile.name)}_${record.id.slice(-8)}.json`,exportRecord(record));toast('Response file exported. Share it with your presenter; no automatic upload occurs.')}
async function resumeFile(e){try{const r=validateRecord(await readJSON(e.target.files[0]));if(record&&!confirm('Replace this browser’s current record with the imported response?'))return;record=r;personalRGA=null;navIndex={kr:0,kg:0};persist();render(true);toast('Committed responses restored.')}catch(err){toast(err.message)}}
function validRGA(o){if(!o||o.schema!=='RizSimulation.RGA.v1'||o.assessment!==DATA.meta.id||o.recordId!==record.id||o.fingerprint!==fingerprint(record))throw new Error('This summary does not match your completed response record.');const m=o.metrics;const bounded=(n,max)=>Number.isInteger(n)&&n>=0&&n<=max;if(!m||!bounded(m.kr,6)||!bounded(m.kg,6)||!bounded(m.source,2)||!bounded(m.transfer,2)||!Array.isArray(m.concepts)||m.concepts.length!==2)throw new Error('Invalid RGA score data.');for(const c of m.concepts)if(!bounded(c.kr,3)||!bounded(c.kg,3))throw new Error('Invalid concept score.');if(m.concepts.reduce((s,c)=>s+c.kr,0)!==m.kr||m.concepts.reduce((s,c)=>s+c.kg,0)!==m.kg)throw new Error('Inconsistent aggregate score totals.');return{schema:o.schema,assessment:o.assessment,recordId:o.recordId,fingerprint:o.fingerprint,issuedAt:o.issuedAt,metrics:{kr:m.kr,kg:m.kg,source:m.source,transfer:m.transfer,concepts:m.concepts.map((c,i)=>({name:DATA.pairs[i].concept,kr:c.kr,kg:c.kg}))}}}
async function importRGA(e){try{if(!record?.kg.at)throw new Error('Complete KG before importing results.');personalRGA=validRGA(await readJSON(e.target.files[0]));persist();render(true);toast('Your aggregate learning summary is ready.')}catch(err){toast(err.message)}finally{e.target.value=''}}
function resetParticipant(){if(!confirm('Clear your local participant record? Export it first to keep a copy.'))return;record=null;personalRGA=null;navIndex={kr:0,kg:0};try{localStorage.removeItem(STORE)}catch(e){}render(true)}
if(personalRGA){try{personalRGA=validRGA(personalRGA)}catch(e){personalRGA=null}}
/* Personal results are authorized by the signed-in RizSim result RPC. */
if(window.__RIZSIM_SIM02_HOSTED__){
  $('app').innerHTML='<section class="panel" role="status"><h2>Verifying your RizSim classroom…</h2><p>Your signed-in Student attempt is being checked.</p></section>';
}else render();

</script><script src="/simulation-assets/system-1-system-2/bridge_student.js"></script><script src="/simulation-assets/system-1-system-2/cloud.js"></script><script src="/rizsim-v154-runner-shell.js" defer></script>
</body></html>
