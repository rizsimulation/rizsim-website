<header class="site-header">

  <div class="nav-glow"></div>

  <div class="nav-shell">


    <button
      class="sidebar-toggle"
      id="sidebarToggle"
      type="button"
      aria-label="Open sidebar"
      aria-expanded="false"
      aria-controls="siteSidebar"
      data-swipe-block
    >

      <span class="sidebar-toggle-icon">
        <span></span>
        <span></span>
        <span></span>
      </span>

    </button>



    <a
      class="nav-logo-link"
      href="index.html"
      data-page-link
      aria-label="RizSim Home"
    >

      <img
        class="nav-logo"
        src="RizSim finalized logo.png"
        alt="RizSim — From Knowing to Doing"
      >

    </a>



    <nav
      class="main-nav"
      id="mainNav"
      aria-label="Main website navigation"
    >

      <a
        href="index.html"
        data-page-link
        data-page="home"
      >
        Home
      </a>

      <a
        href="simulations.html"
        data-page-link
        data-page="simulations"
      >
        Simulations
      </a>

      <a
        href="learning.html"
        data-page-link
        data-page="learning"
      >
        Learning
      </a>

      <a
        href="research.html"
        data-page-link
        data-page="research"
      >
        Research
      </a>

      <a
        href="about.html"
        data-page-link
        data-page="about"
      >
        About
      </a>

      <a
        href="contact.html"
        data-page-link
        data-page="contact"
      >
        Contact
      </a>

    </nav>



    <div class="nav-actions">


      <div class="login-wrap">


        <button
          class="login-button"
          id="loginButton"
          type="button"
          aria-expanded="false"
          aria-controls="loginMenu"
        >

          <span>
            Login
          </span>

          <svg
            class="login-chevron"
            viewBox="0 0 20 20"
            aria-hidden="true"
          >

            <path
              d="M5 7.5L10 12.5L15 7.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

          </svg>

        </button>



        <div
          class="login-menu"
          id="loginMenu"
          aria-hidden="true"
          data-swipe-block
        >


          <div class="login-menu-heading">

            <span class="login-menu-eyebrow">
              RIZSIM ACCESS
            </span>

            <strong>
              Choose your workspace
            </strong>

          </div>



          <a
            class="login-floating-option"
            href="access-in.html"
          >

            <div class="login-option-icon">

              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
              >

                <path
                  d="M4 6.5C4 5.67 4.67 5 5.5 5H18.5C19.33 5 20 5.67 20 6.5V16.5C20 17.33 19.33 18 18.5 18H5.5C4.67 18 4 17.33 4 16.5V6.5Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                />

                <path
                  d="M8 21H16M12 18V21"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />

              </svg>

            </div>


            <div class="login-option-copy">

              <strong>
                My Learning
              </strong>

              <span>
                Buy, launch and continue your learning.
              </span>

            </div>


            <span class="login-option-arrow">
              →
            </span>

          </a>



          <a
            class="login-floating-option"
            href="access-out.html"
          >

            <div class="login-option-icon faculty">

              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
              >

                <path
                  d="M4 20V10M10 20V4M16 20V13M22 20H2"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />

              </svg>

            </div>


            <div class="login-option-copy">

              <strong>
                Faculty Dashboard
              </strong>

              <span>
                Faculty, facilitators and institutional access.
              </span>

            </div>


            <span class="login-option-arrow">
              →
            </span>

          </a>



          <button
            class="login-collapse-button"
            id="loginCollapseButton"
            type="button"
            aria-label="Collapse login menu"
          >

            <svg
              viewBox="0 0 20 20"
              aria-hidden="true"
            >

              <path
                d="M5 12L10 7L15 12"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />

            </svg>

          </button>


        </div>

      </div>



      <button
        class="mobile-menu-button"
        id="mobileMenuButton"
        type="button"
        aria-label="Open navigation"
        aria-expanded="false"
      >

        <span></span>
        <span></span>
        <span></span>

      </button>


    </div>

  </div>

</header>


<div
  class="sidebar-overlay"
  id="sidebarOverlay"
  aria-hidden="true"
></div>


<aside
  class="site-sidebar"
  id="siteSidebar"
  aria-label="RizSim sidebar"
  aria-hidden="true"
  data-swipe-block
>

  <div class="sidebar-inner">

    <!-- Intentionally empty -->

  </div>

</aside>
