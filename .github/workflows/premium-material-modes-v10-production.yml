name: Premium Materials V10 Production Asset Verification
on:
  push:
    branches: [main]
    paths:
      - 'access-*.html'
      - 'course-material-viewer.html'
      - 'rizsim-refinements-v10.*'
      - 'rizsim-course-*'
      - 'rizsim-student-workspace.js'
      - 'scripts/verify_premium_materials_v10_release.py'
      - '.github/workflows/premium-material-modes-v10-production.yml'
permissions:
  contents: read
concurrency:
  group: premium-materials-v10-production
  cancel-in-progress: true
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 25 exact production assets and protected unauthenticated stream
        env:
          RIZSIM_RELEASE_SHA: ${{ github.sha }}
        run: python scripts/verify_premium_materials_v10_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-materials-v10-live-asset-evidence
          path: test-results/
          retention-days: 5
