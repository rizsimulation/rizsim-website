name: V5 Session Confirmation Integration
on:
  push:
    branches: ["feat/live-classroom-compact-v5-20261015"]
    paths:
      - 'scripts/apply_session_confirmation_v5.py'
      - 'scripts/test_session_confirmation_v5.py'
      - 'rizsim-session-confirmation.js'
      - '.github/workflows/v5-session-confirmation-integration.yml'
permissions:
  contents: write
concurrency:
  group: v5-confirmation-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply narrowly scoped confirmation integration
        run: python scripts/apply_session_confirmation_v5.py
      - name: Static and existing security-boundary regression checks
        run: |
          node --check rizsim-session-confirmation.js
          node scripts/validate_live_classroom_v5.js
          node scripts/validate_faculty_workspaces.js
          node scripts/validate_session_continuity.js
          node scripts/validate_premium_ui_v3.js
          python scripts/validate_category_release.py
      - name: Install pinned isolated browser dependencies
        run: |
          python -m pip install playwright==1.57.0 pillow==11.3.0 zxing-cpp==2.3.0
          python -m playwright install --with-deps chromium
      - name: Run browser verification with no live backend
        run: |
          python scripts/test_live_classroom_v5.py
          python scripts/test_live_classroom_v5_extended.py
          python scripts/test_session_confirmation_v5.py
      - name: Save tested integration to the same development branch only
        env:
          BRANCH: feat/live-classroom-compact-v5-20261015
        run: |
          git add access-out.html rizsim-live-classroom.css scripts/test_live_classroom_v5_extended.py
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'RizSim verification'
          git config user.email 'rizsimulation@users.noreply.github.com'
          git commit -m 'fix(v5): integrate browser-verified explicit session confirmation'
          git push origin "HEAD:refs/heads/$BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-session-confirmation-evidence
          path: test-results/
          retention-days: 7
