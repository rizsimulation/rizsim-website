name: Big Five isolated candidate review
on:
  push:
    branches: [frontend/big-five-integration]
    paths: [.github/workflows/big-five-stage.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: frontend/big-five-integration
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify current main and read-only production baseline
        env:
          RIZSIM_RELEASE_SHA: bd161b3be6543afc337c2a7a44402f33c5e35518
        run: |
          test "$GITHUB_REF" = refs/heads/frontend/big-five-integration
          test "$(git rev-parse origin/main)" = bd161b3be6543afc337c2a7a44402f33c5e35518
          python scripts/verify_design_code_v14_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: big-five-baseline-production
          path: test-results/design-code-v14-production/
          retention-days: 7
      - name: Verify exact checksum and Frontend scope before applying
        shell: python
        run: |
          import base64,lzma,hashlib,pathlib,re,subprocess,os,json
          assert os.environ['GITHUB_REF']=='refs/heads/frontend/big-five-integration'
          chunks=[pathlib.Path(f'scripts/.bf-candidate-{i}.txt').read_text().strip() for i in range(1,19)]
          print('Chunks:',[{'length':len(x),'sha256':hashlib.sha256(x.encode()).hexdigest()} for x in chunks])
          assert [len(x) for x in chunks]==[6000]*17+[652]
          data=lzma.decompress(base64.b64decode(''.join(chunks),validate=True))
          assert hashlib.sha256(data).hexdigest()=='0dbb117e54d5f748cf9e85bfa4fb8cf32650d1e8a7e4ca1b75d3b5afe0b982ca','Candidate checksum mismatch; no changes applied'
          allowed={'AGENTS.md','RIZSIM_ANALYTICS_DASHBOARD_CODE.md','access-out.html','docs/big-five-integration.md','docs/big-five-source-manifest.json','rizsim-big-five-faculty.js','rizsim-live-classroom.js','rizsim-live-workspace.js','scripts/big_five_scope.py','scripts/fixtures/big-five-backend.js','scripts/fixtures/big-five-originals.json','scripts/greenwashing_scope.py','scripts/test_big_five_browser.py','scripts/test_big_five_core.cjs','scripts/validate_big_five_source.py','simulation-assets/big-five/cloud.js','simulation-assets/big-five/engine.js','simulation-assets/big-five/questions.js','simulation-assets/big-five/student.js','simulation-assets/big-five/styles.css','simulation-assets/big-five/teaching.js','simulation-assets/big-five/views.js','simulation-big-five.html'}
          paths=set(re.findall(r'^diff --git a/(.*?) b/',data.decode(),re.M))
          assert paths==allowed,(paths-allowed,allowed-paths)
          pathlib.Path('/tmp/big-five.patch').write_bytes(data)
          subprocess.run(['git','apply','--check','/tmp/big-five.patch'],check=True)
          subprocess.run(['git','apply','/tmp/big-five.patch'],check=True)
          for i in range(1,19):pathlib.Path(f'scripts/.bf-candidate-{i}.txt').unlink()
          pathlib.Path('/tmp/big-five-allowed.json').write_text(json.dumps(sorted(allowed)))
      - name: Academic fidelity, calculations and exact integration hooks
        run: |
          node scripts/test_big_five_core.cjs
          node scripts/validate_design_code_v1.cjs
          node scripts/validate_v155_release.cjs
          node --check rizsim-big-five-faculty.js
          for file in simulation-assets/big-five/*.js; do node --check "$file"; done
          python -m py_compile scripts/test_big_five_browser.py scripts/big_five_scope.py scripts/validate_big_five_source.py
          python - <<'PY'
          import sys,subprocess
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from frontend_v14_scope import presentation_equivalent
          for path in ['access-out.html','rizsim-live-classroom.js','rizsim-live-workspace.js']:
              old=subprocess.check_output(['git','show','bd161b3:'+path])
              new=Path(path).read_bytes()
              assert presentation_equivalent(old,new,path),path
              assert not presentation_equivalent(old,new+b'\n// unauthorized adjacent change',path),path
          PY
          git diff --check
      - name: Commit only scoped application and tests
        id: commit
        run: |
          test "$(git branch --show-current)" = frontend/big-five-integration
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          allowed=json.loads(Path('/tmp/big-five-allowed.json').read_text())
          subprocess.run(['git','add','--',*allowed],check=True)
          subprocess.run(['git','add','-u','--',*[f'scripts/.bf-candidate-{i}.txt' for i in range(1,19)]],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          assert not any(x.startswith('.github/workflows/') for x in changed)
          PY
          git commit -m 'Integrate source-grounded Big Five KR-LT-KG learner and Faculty workflows'
          git push origin HEAD:frontend/big-five-integration
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Preserve reproducible source evidence
        if: always()
        run: |
          mkdir -p test-results/big-five-source
          git bundle create test-results/big-five-source/source.bundle --all
          git diff bd161b3be6543afc337c2a7a44402f33c5e35518 > test-results/big-five-source/candidate.diff
          git rev-parse HEAD > test-results/big-five-source/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: big-five-candidate-source
          path: test-results/big-five-source/
          retention-days: 7
  mounted:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        scope: [student, faculty]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned isolated Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Actual mounted workflows and separate tabs with synthetic adapters
        env:
          BF_SCOPE: ${{ matrix.scope }}
          RIZSIM_HEADED: '1'
        run: xvfb-run -a python scripts/test_big_five_browser.py
      - name: Record exact tested commit
        if: always()
        run: |
          mkdir -p test-results/big-five
          git rev-parse HEAD > test-results/big-five/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: big-five-review-${{ matrix.scope }}
          path: test-results/big-five/
          retention-days: 7
