name: Big Five isolated candidate review
on:
  push:
    branches: [frontend/big-five-integration]
    paths: [.github/workflows/big-five-stage.yml, scripts/.bf-review-fix.py]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: frontend/big-five-integration
      - name: Apply exact non-workflow review corrections
        run: |
          test "$GITHUB_REF" = refs/heads/frontend/big-five-integration
          python scripts/.bf-review-fix.py
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())
          assert changed=={'simulation-assets/big-five/styles.css','scripts/test_big_five_browser.py'},changed
          PY
          node scripts/test_big_five_core.cjs
          python -m py_compile scripts/test_big_five_browser.py
          git diff --check
      - name: Commit only scoped application and test corrections
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulation-assets/big-five/styles.css scripts/test_big_five_browser.py
          git commit -m 'Remove duplicate Big Five Presenter headings and stabilize source preview capture'
          git push origin HEAD:frontend/big-five-integration
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Preserve reproducible source evidence
        if: always()
        run: |
          mkdir -p test-results/big-five-source
          git bundle create test-results/big-five-source/source.bundle --all
          git diff bd161b3be6543afc337c2a7a44402f33c5e35518 > test-results/big-five-source/candidate.diff
          git rev-parse HEAD > test-results/big-five-source/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: big-five-candidate-source
          path: test-results/big-five-source/
          retention-days: 7
  mounted:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        scope: [student, faculty]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned isolated Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Actual mounted workflows and separate tabs with synthetic adapters
        env:
          BF_SCOPE: ${{ matrix.scope }}
          RIZSIM_HEADED: '1'
        run: xvfb-run -a python scripts/test_big_five_browser.py
      - name: Record exact tested commit
        if: always()
        run: |
          mkdir -p test-results/big-five
          git rev-parse HEAD > test-results/big-five/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: big-five-review-${{ matrix.scope }}
          path: test-results/big-five/
          retention-days: 7
