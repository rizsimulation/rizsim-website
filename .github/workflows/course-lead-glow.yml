name: Restore Course Lead animated glow
on:
  pull_request:
    branches: [main]
    paths: ['rizsim-design-code-v12.css','scripts/test_course_lead_glow_restore.py','.github/workflows/course-lead-glow.yml']
  push:
    branches: [main]
    paths: ['rizsim-design-code-v12.css','scripts/test_course_lead_glow_restore.py','.github/workflows/course-lead-glow.yml']
permissions:
  contents: read
jobs:
  mounted:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check source and semantics
        run: |
          python -m py_compile scripts/test_course_lead_glow_restore.py
          git diff --check
      - name: Test desktop and mobile real Faculty interface
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python scripts/test_course_lead_glow_restore.py
