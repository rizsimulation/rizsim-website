name: Live Classroom V5 Verification
on:
  push:
    branches: ["feat/live-classroom-compact-v5-20261015"]
  pull_request:
    paths:
      - "access-out.html"
      - "rizsim-live-classroom*"
      - "rizsim-faculty-workspaces*"
      - "rizsim-qr.js"
      - "scripts/**"
      - ".github/workflows/live-classroom-v5.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: classroom-v5-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact committed assets and established regressions
        run: |
          echo 'c75d70a0e18c3609c5428d17d744121023073cf3f480e3194ed93a354756496d  rizsim-qr.js' | sha256sum --check
          node scripts/validate_live_classroom_v5.js
          node scripts/validate_faculty_workspaces.js
          node scripts/validate_session_continuity.js
          node scripts/validate_premium_ui_v3.js
          python scripts/validate_category_release.py
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install playwright==1.57.0 pillow==11.3.0 zxing-cpp==2.3.0
          python -m playwright install --with-deps chromium
      - name: Browser regression with synthetic backend only
        run: |
          python scripts/test_live_classroom_v5.py
          python scripts/test_live_classroom_v5_extended.py
          git diff --exit-code
          git rev-parse HEAD > test-results/verified-revision.txt
      - name: Package exact revision for review
        if: always()
        run: git archive --format=tar.gz HEAD -o /tmp/rizsim-v5-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rizsim-v5-browser-evidence
          path: test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rizsim-v5-review-source
          path: /tmp/rizsim-v5-source.tar.gz
          retention-days: 3
