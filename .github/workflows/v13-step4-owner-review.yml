name: RizSim V13 Step4 Owner Visual Review
on:
  pull_request:
    paths:
      - "scripts/test_v13_step4_owner_combined.py"
      - "rizsim-live-workspace.*"
      - "rizsim-*-faculty.*"
      - "rizsim-live-classroom.js"
      - "access-out.html"
      - ".github/workflows/v13-step4-owner-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner_visual_evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test-only Chromium
        run: |
          python -m pip install playwright==1.57.0 pillow==11.3.0 zxing-cpp==2.3.0
          python -m playwright install --with-deps chromium
      - name: Render authenticated, synthetic full portal Step4 acceptance
        run: |
          mkdir -p test-results
          python scripts/test_v13_step4_owner_combined.py
      - name: Validate no unintended source changes
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rizsim-step4-full-portal-owner-synthetic-screenshots
          path: test-results/step4-integrated-*.png
          retention-days: 7
