name: Student Workspace V8 Production Verification
on:
  push:
    branches: [main]
    paths: ['access-in.html','rizsim-student-workspace.js','rizsim-student-workspace.css','rizsim-shared-home.js','scripts/verify_student_workspace_release.py','.github/workflows/student-workspace-v8-production.yml']
permissions:
  contents: read
concurrency:
  group: student-v8-production
  cancel-in-progress: true
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare 21 public assets against this exact release
        env:
          RIZSIM_RELEASE_SHA: ${{ github.sha }}
        run: python scripts/verify_student_workspace_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-v8-production-verification
          path: test-results/
          retention-days: 3
