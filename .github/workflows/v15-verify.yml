name: RizSim V15 Quality Gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  static-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check V15 JavaScript and required assets
        run: node scripts/v15-check.mjs
