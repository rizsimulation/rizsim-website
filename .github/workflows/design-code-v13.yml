name: RizSim Design Code 1.3 interiors and mounted Faculty
on:
  pull_request:
    branches: [main]
    paths: ['**.css', 'rizsim-v154-runner-shell.js', 'scripts/test_design_code_v13*.py', 'scripts/verify_design_code_v13_release.py', '.github/workflows/design-code-v13.yml']
  push:
    branches: [main]
    paths: ['**.css', 'rizsim-v154-runner-shell.js', 'scripts/test_design_code_v13*.py', 'scripts/verify_design_code_v13_release.py', '.github/workflows/design-code-v13.yml']
permissions:
  contents: read
concurrency:
  group: design-code-v13-${{ github.ref }}
  cancel-in-progress: true
jobs:
  interiors:
    strategy:
      fail-fast: false
      matrix:
        scope: [runners, faculty]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real interiors and mounted tabs using synthetic data only
        env:
          RIZSIM_V13_SCOPE: ${{ matrix.scope }}
          RIZSIM_V13_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/test_design_code_v13_settled.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-code-v13-${{ matrix.scope }}
          path: test-results/design-code-v13/
          retention-days: 7
  verify-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: interiors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact live bytes
        env:
          RIZSIM_RELEASE_SHA: ${{ github.sha }}
        run: python scripts/verify_design_code_v13_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-code-v13-production
          path: test-results/design-code-v13-production/
          retention-days: 7
