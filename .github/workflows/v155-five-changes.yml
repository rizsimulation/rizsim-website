name: RizSim V15.5 Five Changes Regression
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  static-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Five change contract and JS syntax verification
        run: node scripts/validate_v155_release.cjs
  isolated-browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated offline Chromium for synthetic runner tests
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test Insight to Implication response integrity in the synthetic browser
        run: python scripts/test_insight_student_v1.py
      - name: Test System 1 and System 2 response integrity in the synthetic browser
        run: python scripts/test_sim02_student_v1.py
