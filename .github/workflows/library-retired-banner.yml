name: Student Library expired-banner removal
on:
  pull_request:
    branches: [main]
    paths: ['rizsim-v15-launch-countdowns.js','scripts/test_library_retired_banner.py','.github/workflows/library-retired-banner.yml']
  push:
    branches: [main]
    paths: ['rizsim-v15-launch-countdowns.js','scripts/test_library_retired_banner.py','.github/workflows/library-retired-banner.yml']
permissions:
  contents: read
jobs:
  mounted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Source and existing core checks
        run: |
          node --check rizsim-v15-launch-countdowns.js
          node scripts/validate_v155_release.cjs
          git diff --check
      - name: Chromium with isolated synthetic classroom
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python scripts/test_library_retired_banner.py
