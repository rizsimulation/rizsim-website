name: RizSim V15.5.2 Three Review Fixes
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  classroom-and-viewer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Chromium (no TinyFish or customer accounts)
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run 3-issue desktop and fallback browser checks
        run: python scripts/test_v1552_review_fixes.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: three-fixes-browser-evidence
          path: test-results/v1552-*.png
          retention-days: 3
