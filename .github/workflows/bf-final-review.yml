name: Big Five final layout review
on:
  push:
    branches: [frontend/big-five-integration]
    paths: [.github/workflows/bf-final-review.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: frontend/big-five-integration
      - name: Apply only the explicit layout repair and regression assertions
        run: |
          test "$GITHUB_REF" = refs/heads/frontend/big-five-integration
          python scripts/.bf-final-review.py
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())
          assert changed=={'rizsim-analytics-v1.css'},changed
          PY
          node scripts/test_big_five_core.cjs
          node scripts/test_greenwashing_core.cjs
          python -m py_compile scripts/test_greenwashing_layout.py
          git diff --check
      - name: Commit only scoped presentation and test files
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rizsim-analytics-v1.css scripts/test_greenwashing_layout.py
          git commit -m 'Keep Greenwashing native analytics compact after delayed shared dashboard refresh'
          git push origin HEAD:frontend/big-five-integration
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Reproducible source
        if: always()
        run: |
          mkdir -p test-results/source
          git bundle create test-results/source/source.bundle --all
          git rev-parse HEAD > test-results/source/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: big-five-final-layout-source
          path: test-results/source/
          retention-days: 7
  review:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        simulation: [big_five, greenwashing]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Both native Faculty surfaces after delayed shared refresh
        env:
          BF_SCOPE: faculty
          GW_SCOPE: faculty
          RIZSIM_HEADED: '1'
        run: xvfb-run -a python scripts/test_${{ matrix.simulation }}_layout.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-layout-${{ matrix.simulation }}
          path: test-results/
          retention-days: 7
