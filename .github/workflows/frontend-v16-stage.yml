name: Stage RizSim Frontend 1.6
on:
  push:
    branches: [frontend/premium-empty-states-modality-20261025]
    paths: [.github/workflows/frontend-v16-stage.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend/premium-empty-states-modality-20261025
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify baseline and checksum-guarded presentation-only patch
        run: |
          test "$(git rev-parse HEAD~)" = 181d3b597e4a8460bdf6664ba7a0414cfdaacacb
          test "$(git rev-parse origin/main)" = 4e726d26d9ee5ed2c99d2f7cb57f589e6b8cb031
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,hashlib,re,subprocess
          source=Path('scripts/.v16-design-candidate.b64').read_text().strip()
          patch=lzma.decompress(base64.b64decode(source,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='36351b006400ebe9a5b3547bb467385907331d633524edcf956c0ada0f2e666a'
          paths=set(re.findall(r'^diff --git a/(.*?) b/',patch.decode(),re.M))
          allowed={'rizsim-analytics-v1.css','rizsim-analytics-v1.js','rizsim-course-authoring.css','rizsim-experiences.css','rizsim-student-workspace.css','rizsim-student-workspace.js','rizsim-v15-live-control.js','rizsim-v15-premium.css','rizsim-learning-space-illustration.svg'}
          assert paths==allowed,('Unexpected paths',paths^allowed)
          Path('/tmp/v16.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/v16.patch'],check=True)
          subprocess.run(['git','apply','/tmp/v16.patch'],check=True)
          assert Path('rizsim-learning-space-illustration.svg').stat().st_size<12000
          print('Verified reviewed Frontend UI diff. SVG bytes:',Path('rizsim-learning-space-illustration.svg').stat().st_size)
          PY
      - name: Validate no grading or permission changes
        run: |
          node --check rizsim-v15-live-control.js
          node --check rizsim-student-workspace.js
          node --check rizsim-analytics-v1.js
          node scripts/test_analytics_v1.cjs
          node scripts/test_big_five_core.cjs
          node scripts/test_greenwashing_core.cjs
          node scripts/validate_design_code_v1.cjs
          node scripts/validate_v155_release.cjs
          python scripts/validate_big_five_source.py
          python scripts/validate_greenwashing_source.py
          git diff --check
      - name: Commit scoped changes and remove one-off staging tools
        run: |
          rm scripts/.v16-design-candidate.b64 .github/workflows/frontend-v16-stage.yml
          git add -- rizsim-analytics-v1.css rizsim-analytics-v1.js rizsim-course-authoring.css rizsim-experiences.css rizsim-student-workspace.css rizsim-student-workspace.js rizsim-v15-live-control.js rizsim-v15-premium.css rizsim-learning-space-illustration.svg
          git add -u -- scripts/.v16-design-candidate.b64 .github/workflows/frontend-v16-stage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'Refine Live and Practice choices, compact empty collection art and honest chart placeholders'
          git push origin HEAD:frontend/premium-empty-states-modality-20261025
