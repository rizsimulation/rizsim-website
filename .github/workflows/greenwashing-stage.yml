name: Greenwashing isolated candidate review
on:
  push:
    branches: [frontend/greenwashing-integration]
    paths: [.github/workflows/greenwashing-stage.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: frontend/greenwashing-integration
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact mounted-review changes
        run: |
          test "$GITHUB_REF" = refs/heads/frontend/greenwashing-integration
          python scripts/.gw-review.py
          python - <<'PY'
          import subprocess
          from pathlib import Path
          allowed={'simulation-assets/greenwashing/student.js','simulation-assets/greenwashing/styles.css','rizsim-greenwashing-faculty.js','scripts/test_greenwashing_browser.py'}
          paths=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert paths==allowed,paths
          Path('scripts/.gw-review.py').unlink()
          PY
          node scripts/test_greenwashing_core.cjs
          node --check simulation-assets/greenwashing/student.js
          node --check rizsim-greenwashing-faculty.js
          python -m py_compile scripts/test_greenwashing_browser.py
          git diff --check
      - name: Commit only scoped application and test corrections
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulation-assets/greenwashing/student.js simulation-assets/greenwashing/styles.css rizsim-greenwashing-faculty.js scripts/test_greenwashing_browser.py scripts/.gw-review.py
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git commit -m 'Retain pending learner choices and consolidate mounted Greenwashing report chrome'
          git push origin HEAD:frontend/greenwashing-integration
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Preserve source evidence
        if: always()
        run: |
          mkdir -p test-results/greenwashing-source
          git bundle create test-results/greenwashing-source/source.bundle --all
          git rev-parse HEAD > test-results/greenwashing-source/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: greenwashing-candidate-source
          path: test-results/greenwashing-source/
          retention-days: 7
  mounted:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scope: [student, faculty]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned isolated browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Actual mounted workflows and separate tabs with synthetic adapters
        env:
          GW_SCOPE: ${{ matrix.scope }}
          RIZSIM_HEADED: '1'
        run: xvfb-run -a python scripts/test_greenwashing_browser.py
      - name: Record exact tested commit
        if: always()
        run: |
          mkdir -p test-results/greenwashing
          git rev-parse HEAD > test-results/greenwashing/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: greenwashing-review-${{ matrix.scope }}
          path: test-results/greenwashing/
          retention-days: 7
