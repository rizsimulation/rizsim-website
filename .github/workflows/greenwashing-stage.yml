name: Greenwashing isolated candidate review
on:
  push:
    branches: [frontend/greenwashing-integration]
    paths: [.github/workflows/greenwashing-stage.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: frontend/greenwashing-integration
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only baseline production check
        env:
          RIZSIM_RELEASE_SHA: 4d1ccafe4e672971b7284786e2265f5ceb771435
        run: |
          test "$GITHUB_REF" = refs/heads/frontend/greenwashing-integration
          test "$(git rev-parse origin/main)" = 4d1ccafe4e672971b7284786e2265f5ceb771435
          python scripts/verify_design_code_v14_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: greenwashing-baseline-production
          path: test-results/design-code-v14-production/
          retention-days: 7
      - name: Verify exact candidate checksum and file scope
        shell: python
        run: |
          import base64,lzma,hashlib,pathlib,re,subprocess,os,json
          assert os.environ['GITHUB_REF']=='refs/heads/frontend/greenwashing-integration'
          chunks=[pathlib.Path(f'scripts/.gw-candidate-{i}.txt').read_text().strip() for i in range(1,15)]
          print('Chunk lengths:',[len(x) for x in chunks])
          data=lzma.decompress(base64.b64decode(''.join(chunks),validate=True))
          assert hashlib.sha256(data).hexdigest()=='daf8fe737543587aaa04877304bf367100c9108b297292c55cefddd7cac7d767','Candidate checksum mismatch; no changes applied'
          allowed={'.github/workflows/design-code-v14.yml','.github/workflows/greenwashing-integration.yml','AGENTS.md','RIZSIM_ANALYTICS_DASHBOARD_CODE.md','access-out.html','docs/greenwashing-integration.md','docs/greenwashing-source-manifest.json','rizsim-greenwashing-faculty.js','rizsim-live-classroom.js','rizsim-live-workspace.js','scripts/fixtures/greenwashing-backend.js','scripts/frontend_v14_scope.py','scripts/greenwashing_scope.py','scripts/test_design_code_v11.py','scripts/test_design_code_v12.py','scripts/test_design_code_v13.py','scripts/test_greenwashing_browser.py','scripts/test_greenwashing_core.cjs','scripts/validate_greenwashing_source.py','simulation-assets/greenwashing/cloud.js','simulation-assets/greenwashing/engine.js','simulation-assets/greenwashing/questions.js','simulation-assets/greenwashing/student.js','simulation-assets/greenwashing/styles.css','simulation-assets/greenwashing/teaching.js','simulation-assets/greenwashing/views.js','simulation-greenwashing.html'}
          paths=set(re.findall(r'^diff --git a/(.*?) b/',data.decode(),re.M))
          assert paths==allowed,(paths-allowed,allowed-paths)
          pathlib.Path('/tmp/greenwashing.patch').write_bytes(data)
          subprocess.run(['git','apply','--check','/tmp/greenwashing.patch'],check=True)
          subprocess.run(['git','apply','/tmp/greenwashing.patch'],check=True)
          for i in range(1,15):pathlib.Path(f'scripts/.gw-candidate-{i}.txt').unlink()
          pathlib.Path('.github/workflows/greenwashing-stage.yml').unlink()
          pathlib.Path('/tmp/greenwashing-allowed.json').write_text(json.dumps(sorted(allowed)))
      - name: Academic fidelity, calculations and source checks
        env:
          GW_BASE: 4d1ccafe4e672971b7284786e2265f5ceb771435
        run: |
          node scripts/test_greenwashing_core.cjs
          node scripts/validate_design_code_v1.cjs
          node scripts/validate_v155_release.cjs
          node --check rizsim-greenwashing-faculty.js
          for file in simulation-assets/greenwashing/*.js; do node --check "$file"; done
          python scripts/validate_greenwashing_source.py
          python -m py_compile scripts/test_greenwashing_browser.py
          git diff --check
      - name: Commit candidate only to scoped branch
        id: commit
        run: |
          test "$(git branch --show-current)" = frontend/greenwashing-integration
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          allowed=json.loads(Path('/tmp/greenwashing-allowed.json').read_text())
          subprocess.run(['git','add','--',*allowed],check=True)
          subprocess.run(['git','add','-u','--',*[f'scripts/.gw-candidate-{i}.txt' for i in range(1,15)],'.github/workflows/greenwashing-stage.yml'],check=True)
          PY
          git commit -m 'Integrate source-grounded Greenwashing learner and Faculty workflows under Design Code 1.4'
          git push origin HEAD:frontend/greenwashing-integration
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Preserve source and review evidence
        if: always()
        run: |
          mkdir -p test-results/greenwashing-source
          git bundle create test-results/greenwashing-source/source.bundle --all
          git diff 4d1ccafe4e672971b7284786e2265f5ceb771435 > test-results/greenwashing-source/candidate.diff
          git rev-parse HEAD > test-results/greenwashing-source/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: greenwashing-candidate-source
          path: test-results/greenwashing-source/
          retention-days: 7
  mounted:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scope: [student, faculty]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned isolated browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Actual mounted workflows and separate tabs with synthetic adapters
        env:
          GW_SCOPE: ${{ matrix.scope }}
          RIZSIM_HEADED: '1'
        run: xvfb-run -a python scripts/test_greenwashing_browser.py
      - name: Record exact tested commit
        if: always()
        run: |
          mkdir -p test-results/greenwashing
          git rev-parse HEAD > test-results/greenwashing/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: greenwashing-review-${{ matrix.scope }}
          path: test-results/greenwashing/
          retention-days: 7
