name: Frontend 1.6 design and empty-state regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [frontend/premium-empty-states-modality-20261025,main]
permissions:
  contents: read
concurrency:
  group: frontend-v16-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Source checks and prior calculation contracts
        run: |
          node --check rizsim-v15-live-control.js
          node --check rizsim-student-workspace.js
          node --check rizsim-analytics-v1.js
          node scripts/test_analytics_v1.cjs
          node scripts/test_big_five_core.cjs
          node scripts/test_greenwashing_core.cjs
          node scripts/validate_design_code_v1.cjs
          node scripts/validate_v155_release.cjs
          python scripts/validate_big_five_source.py
          python scripts/validate_greenwashing_source.py
          python -m py_compile scripts/test_frontend_v16.py
          git diff --check
  mounted:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        scenario: [faculty, student, analytics, authoring-regression, learning-regression, dashboard-regression]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install isolated Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run real mounted interface test with synthetic backend
        env:
          RIZSIM_V16_SCOPE: ${{ matrix.scenario }}
          RIZSIM_HEADED: '1'
        run: |
          case "${{ matrix.scenario }}" in
            faculty|student|analytics) xvfb-run -a python scripts/test_frontend_v16.py ;;
            authoring-regression) xvfb-run -a python scripts/test_course_authoring_v7.py ;;
            learning-regression) xvfb-run -a python scripts/test_student_workspace_v8.py ;;
            dashboard-regression) xvfb-run -a python scripts/test_design_code_v14.py ;;
          esac
      - name: Save exact tested commit
        if: always()
        run: |
          mkdir -p test-results/frontend-v16
          git rev-parse HEAD > test-results/frontend-v16/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-v16-${{ matrix.scenario }}
          path: test-results/
          retention-days: 9
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [source,mounted]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Production source-to-asset verification
        env:
          RIZSIM_RELEASE_SHA: ${{ github.sha }}
        run: python scripts/verify_design_code_v14_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-v16-production
          path: test-results/design-code-v14-production/
          retention-days: 14
