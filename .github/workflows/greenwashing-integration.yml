name: Greenwashing native simulation integration
on:
  pull_request:
    branches: [main]
    paths: ['simulation-greenwashing.html', 'simulation-assets/greenwashing/**', 'rizsim-greenwashing-faculty.js', 'access-out.html', 'rizsim-live-*.js', 'scripts/**', '.github/workflows/greenwashing-integration.yml', 'docs/greenwashing*', 'RizSim_Master_Status.md']
  push:
    branches: [main]
    paths: ['simulation-greenwashing.html', 'simulation-assets/greenwashing/**', 'rizsim-greenwashing-faculty.js', 'access-out.html', 'rizsim-live-*.js', 'scripts/**', '.github/workflows/greenwashing-integration.yml', 'docs/greenwashing*', 'RizSim_Master_Status.md']
permissions:
  contents: read
concurrency:
  group: greenwashing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Academic fidelity, calculations and unchanged contracts
        env:
          GW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p test-results/greenwashing-source
          node scripts/test_greenwashing_core.cjs | tee test-results/greenwashing-source/core.txt
          node scripts/validate_design_code_v1.cjs
          node scripts/validate_v155_release.cjs
          node --check rizsim-greenwashing-faculty.js
          for file in simulation-assets/greenwashing/*.js; do node --check "$file"; done
          python scripts/validate_greenwashing_source.py
          git diff --check
      - name: Source evidence
        if: always()
        run: |
          mkdir -p test-results/greenwashing-source
          git rev-parse HEAD > test-results/greenwashing-source/commit.txt
          git bundle create test-results/greenwashing-source/source.bundle --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: greenwashing-source
          path: test-results/greenwashing-source/
          retention-days: 7
  mounted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scope: [student, faculty]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Actual mounted learner and Faculty workflows with synthetic data
        env:
          GW_SCOPE: ${{ matrix.scope }}
          RIZSIM_HEADED: '1'
        run: xvfb-run -a python scripts/test_greenwashing_browser.py
      - name: Record exact test commit
        if: always()
        run: |
          mkdir -p test-results/greenwashing
          git rev-parse HEAD > test-results/greenwashing/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: greenwashing-${{ matrix.scope }}
          path: test-results/greenwashing/
          retention-days: 7
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [source, mounted]
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only exact deployed runtime hashes
        env:
          RIZSIM_RELEASE_SHA: ${{ github.sha }}
        run: python scripts/verify_design_code_v14_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: greenwashing-production
          path: test-results/design-code-v14-production/
          retention-days: 14
